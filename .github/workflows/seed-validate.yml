name: Seed Validate

on:
  push:
    branches: [main]
    paths:
      - "packages/**/passport.json"
      - "schemas/passport.schema.json"
      - "taxonomy.json"
      - "scripts/seed-*.mjs"
      - "scripts/lib.mjs"
      - ".github/workflows/seed-validate.yml"
  pull_request:
    paths:
      - "packages/**/passport.json"
      - "schemas/passport.schema.json"
      - "taxonomy.json"
      - "scripts/seed-*.mjs"
      - "scripts/lib.mjs"
      - ".github/workflows/seed-validate.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - run: corepack enable

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22

      - name: Install root deps only
        run: pnpm install --ignore-workspace

      - name: Validate passports
        run: pnpm seed:validate
