name: Seed Validate

on:
  push:
    branches: [main]
    paths:
      - "packages/**/passport.json"
      - "schemas/passport.schema.json"
      - "taxonomy.json"
      - "scripts/seed-*.mjs"
      - "scripts/lib.mjs"
      - ".github/workflows/seed-validate.yml"
  pull_request:
    paths:
      - "packages/**/passport.json"
      - "schemas/passport.schema.json"
      - "taxonomy.json"
      - "scripts/seed-*.mjs"
      - "scripts/lib.mjs"
      - ".github/workflows/seed-validate.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4

      - run: corepack enable

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Install root deps only
        run: pnpm install --ignore-workspace

      - name: Validate passports
        run: pnpm seed:validate
