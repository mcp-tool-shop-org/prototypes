name: Receipt Release

on:
  workflow_call:
    inputs:
      upload_artifact:
        type: boolean
        default: true
        description: Upload receipt artifacts
      output_dir:
        type: string
        default: receipts
        description: Output directory for receipts

jobs:
  receipt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: pnpm/action-setup@02f6c237bd2518259fed6c71566509edfb3f2b74 # v4

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      - name: Generate release receipt
        run: npx rf make release --from github --output ${{ inputs.output_dir }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: inputs.upload_artifact
        with:
          name: release-receipts
          path: ${{ inputs.output_dir }}/
