name: CI

on:
  push:
    paths:
      - "packages/**"
      - "pipelines/**"
      - "apps/**"
      - "pnpm-lock.yaml"
      - "turbo.json"
      - "tsconfig.base.json"
      - ".github/workflows/**"
  pull_request:
    paths:
      - "packages/**"
      - "pipelines/**"
      - "apps/**"
      - "pnpm-lock.yaml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ["20", "22"]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: pnpm/action-setup@02f6c237bd2518259fed6c71566509edfb3f2b74 # v4

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Dependency audit
        run: pnpm audit --audit-level=high || true

      - run: pnpm build

      - run: pnpm test

      - name: Pack dry-run (publishable packages)
        run: |
          for pkg in packages/core packages/render packages/verify packages/sign packages/evidence packages/index packages/policy packages/bundle packages/adapters/github apps/factory-cli; do
            echo "--- $pkg ---"
            cd $pkg
            npm pack --dry-run 2>&1
            cd $GITHUB_WORKSPACE
          done
