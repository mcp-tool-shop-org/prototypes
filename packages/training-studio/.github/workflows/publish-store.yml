name: Publish to Microsoft Store

on:
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: '9.0.x'

      - name: Install MAUI workloads
        run: dotnet workload install maui-windows

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: TrainingStudio.Web/package-lock.json

      - name: Build Web App
        working-directory: TrainingStudio.Web
        run: |
          npm ci
          npm run build

      - name: Restore
        run: dotnet restore TrainingStudio.App/TrainingStudio.App.csproj

      - name: Build MSIX
        run: |
          dotnet publish TrainingStudio.App/TrainingStudio.App.csproj `
            --configuration Release `
            -p:RuntimeIdentifierOverride=win10-x64 `
            -p:GenerateAppxPackageOnBuild=true `
            -p:AppxPackageSigningEnabled=false

      - name: Install Microsoft Store CLI
        run: dotnet tool install -g MSStore.CLI

      - name: Configure Store CLI
        run: msstore reconfigure --tenantId ${{ secrets.AZURE_TENANT_ID }} --clientId ${{ secrets.AZURE_CLIENT_ID }} --clientSecret ${{ secrets.AZURE_CLIENT_SECRET }} --sellerId ${{ secrets.SELLER_ID }}

      - name: Publish to Store
        run: |
          $msix = Get-ChildItem -Path . -Filter "*.msix" -Recurse | Select-Object -First 1
          msstore publish $msix.FullName
