name: CI

on:
  push:
    branches: [main]
    paths:
      - "**/*.cs"
      - "**/*.csproj"
      - "**/*.sln"
      - ".github/workflows/**"
  pull_request:
    branches: [main]
    paths:
      - "**/*.cs"
      - "**/*.csproj"
      - "**/*.sln"
      - ".github/workflows/**"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup .NET
        uses: actions/setup-dotnet@c2fa09f4bde5ebb9d1777cf28262a3eb3db3ced7 # v5.2.0
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore CodeTeam.sln

      - name: Build
        run: dotnet build CodeTeam.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test CodeTeam.sln --configuration Release --no-build --verbosity normal
        env:
          CODETEAM_CLI_PATH: ${{ github.workspace }}/src/CodeTeam.Cli/bin/Release/net8.0/codeteam
