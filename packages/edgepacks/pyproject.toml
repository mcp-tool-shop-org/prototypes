[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "edgepacks"
version = "1.0.0"
description = "Task-dataset foundry for training small models on narrow jobs"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "mcp-tool-shop", email = "64996768+mcp-tool-shop@users.noreply.github.com" }
]
keywords = [
    "machine-learning",
    "datasets",
    "fine-tuning",
    "small-models",
    "edge-ai",
    "training-data",
    "synthetic-data",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "pydantic>=2.6.0",
    "typer>=0.12.0",
    "rich>=13.7.0",
    "httpx>=0.27.0",
    "jsonschema>=4.21.0",
]

[project.optional-dependencies]
fuzzy = ["datasketch>=1.6.0"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.0",
    "ruff>=0.4.0",
]

[project.scripts]
edgepacks = "edgepacks.cli:app"

[project.urls]
Homepage = "https://github.com/mcp-tool-shop-org/edgepacks"
Repository = "https://github.com/mcp-tool-shop-org/edgepacks"
Issues = "https://github.com/mcp-tool-shop-org/edgepacks/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/edgepacks"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["edgepacks"]

[tool.ruff.lint.per-file-ignores]
"src/edgepacks/packs/*/spec.py" = ["E501"]  # Seed data has long strings
"src/edgepacks/packs/*/tools.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-v", "--tb=short", "-ra", "--strict-markers"]
markers = [
    "unit: fast isolated tests",
    "integration: tests that call Ollama or touch filesystem",
    "slow: tests that generate large datasets",
    "pack: tests specific to a pack",
]
