name: CI

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "pyproject.toml"
      - ".github/workflows/**"
  pull_request:
    branches: [main]
    paths:
      - "src/**"
      - "pyproject.toml"
      - ".github/workflows/**"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Secret scan
        run: |
          echo "Scanning for hardcoded secrets..."
          cat > /tmp/secret-patterns.txt <<PATTERNS
          PRIVATE.KEY
          sk_live_
          sk_test_
          aws_secret
          PATTERNS
          FOUND=0
          while IFS= read -r pattern; do
            pattern=$(echo "$pattern" | xargs)
            [ -z "$pattern" ] && continue
            if git grep -lI "$pattern" -- ':!*.md' ':!.github/workflows/*' 2>/dev/null; then
              echo "FAIL: potential secret pattern '$pattern' found"
              FOUND=1
            fi
          done < /tmp/secret-patterns.txt
          if [ "$FOUND" -eq 1 ]; then exit 1; fi
          echo "No hardcoded secrets detected"

  # Core components (no internal dependencies)
  core:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project:
          - nexus-attest
          - nexus-control
          - nexus-router

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        working-directory: src/${{ matrix.project }}
        run: |
          pip install -e .
          pip install pytest

      - name: Run tests
        working-directory: src/${{ matrix.project }}
        run: pytest -v || echo "No tests or tests skipped"

  # Adapters (depend on nexus-router)
  adapters:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project:
          - nexus-router-adapter-stdout
          - nexus-router-adapter-http

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install nexus-router from local
        run: pip install -e src/nexus-router

      - name: Install adapter
        working-directory: src/${{ matrix.project }}
        run: |
          pip install -e .
          pip install pytest

      - name: Run tests
        working-directory: src/${{ matrix.project }}
        run: pytest -v || echo "No tests or tests skipped"
