name: CI

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'Directory.Build.props'
      - '**/*.csproj'
      - '.github/workflows/**'
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'Directory.Build.props'
      - '**/*.csproj'
      - '.github/workflows/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: windows-latest  # Windows required for DPAPI in CreatorLedger tests

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup .NET
        uses: actions/setup-dotnet@c2fa09f4bde5ebb9d1777cf28262a3eb3db3ced7 # v5.2.0
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore ledger-suite.sln

      - name: Build
        run: dotnet build ledger-suite.sln -c Release --no-restore

      - name: Test
        run: dotnet test ledger-suite.sln -c Release --no-build --verbosity normal
