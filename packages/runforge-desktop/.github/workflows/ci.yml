name: CI

on:
  push:
    branches: [main]
    paths:
      - "src/RunForgeDesktop.Core/**"
      - "Directory.Build.props"
      - ".github/workflows/ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "src/RunForgeDesktop.Core/**"
      - "Directory.Build.props"
      - ".github/workflows/ci.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-dotnet@c2fa09f4bde5ebb9d1777cf28262a3eb3db3ced7 # v5.2.0
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore src/RunForgeDesktop.Core/RunForgeDesktop.Core.csproj

      - name: Build
        run: dotnet build src/RunForgeDesktop.Core/RunForgeDesktop.Core.csproj --configuration Release --no-restore

      - name: Pack dry-run
        run: dotnet pack src/RunForgeDesktop.Core/RunForgeDesktop.Core.csproj --configuration Release --no-build --output ./nupkg
