name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., 1.0.0)'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup .NET
        uses: actions/setup-dotnet@c2fa09f4bde5ebb9d1777cf28262a3eb3db3ced7 # v5.2.0
        with:
          dotnet-version: '9.0.x'

      - name: Determine version
        id: version
        shell: pwsh
        run: |
          if ("${{ github.event.inputs.version }}" -ne "") {
            $version = "${{ github.event.inputs.version }}"
          } elseif ($env:GITHUB_REF -match '^refs/tags/v(.+)$') {
            $version = $Matches[1]
          } else {
            $version = "0.0.0-dev"
          }
          echo "VERSION=$version" >> $env:GITHUB_OUTPUT
          echo "Version: $version"

      - name: Restore dependencies
        run: dotnet restore

      - name: Run tests
        run: dotnet test --no-restore --verbosity minimal

      - name: Locate VS Appx tools
        id: appx
        shell: pwsh
        run: |
          $vsPath = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" `
            -latest -products * -requires Microsoft.Component.MSBuild -property installationPath
          $appxPath = Join-Path $vsPath "MSBuild\Microsoft\VisualStudio\v17.0\AppxPackage\"
          if (!(Test-Path $appxPath)) {
            Write-Warning "AppxPackage path not found at $appxPath — PRI may fail"
          }
          echo "path=$appxPath" >> $env:GITHUB_OUTPUT

      - name: Publish self-contained (x64)
        run: |
          dotnet publish src/NextLedger.App/NextLedger.App.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishReadyToRun=true `
            -p:WindowsAppSDKSelfContained=true `
            -p:AppxMSBuildToolsPath="${{ steps.appx.outputs.path }}" `
            -p:Version=${{ steps.version.outputs.VERSION }} `
            -o publish/NextLedger-${{ steps.version.outputs.VERSION }}-win-x64

      - name: Create ZIP archive
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.VERSION }}"
          Compress-Archive `
            -Path "publish/NextLedger-$version-win-x64/*" `
            -DestinationPath "publish/NextLedger-$version-win-x64.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: NextLedger-${{ steps.version.outputs.VERSION }}-win-x64
          path: publish/NextLedger-${{ steps.version.outputs.VERSION }}-win-x64.zip
          retention-days: 30

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v1
        with:
          files: publish/NextLedger-${{ steps.version.outputs.VERSION }}-win-x64.zip
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(steps.version.outputs.VERSION, '-') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
